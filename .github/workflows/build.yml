# Build, test and release the RF Analyzer FAP in a single workflow.
#
#  - push / PR  -> build the .fap, run tests, upload it as a CI artifact
#  - push a tag matching v*  -> additionally publish a GitHub Release with the .fap
#
# The FAP is built with ufbt (the Flipper Zero micro-build tool), which pulls
# the matching firmware SDK automatically.
name: Build, Test & Release

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create releases / upload assets.
permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test & release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rf_analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python -m pip install --upgrade ufbt

      # --- TEST 1: TX safeguards guard --------------------------------------
      # The Auto Inverse Test mode intentionally uses subghz async TX, so the
      # old receive-only grep is obsolete. Instead assert the safeguards that
      # must always accompany the TX path: disabled-by-default, emergency
      # stop, cooldown enforcement and the prominent AUTO TX indicator.
      - name: Test - assert Auto Inverse Test safeguards present
        run: |
          set -e
          grep -rIn "remove_all_restrictions" --include='*.h' --include='*.c' . >/dev/null
          grep -rIn "rf_tx_emergency_stop" --include='*.c' --include='*.h' . >/dev/null
          grep -rIn "cooldown" --include='*.c' --include='*.h' scenes helpers >/dev/null
          grep -rIn "AUTO TX" --include='*.c' scenes >/dev/null
          grep -rIn "enabled = false" --include='*.h' helpers >/dev/null
          echo "OK: TX safeguard markers present."

      # --- TEST 2: formatting -----------------------------------------------
      # Report clang-format issues but don't fail the build on style alone.
      - name: Test - lint (formatting, non-blocking)
        run: ufbt lint || echo "::warning::ufbt lint reported formatting differences."
        continue-on-error: true

      # --- BUILD ------------------------------------------------------------
      # A clean compile against the real SDK is the primary functional test:
      # if the app does not build, the job fails here.
      - name: Build FAP
        run: ufbt

      - name: Test - verify build output
        run: |
          test -f dist/rf_analyzer.fap
          ls -la dist/
          echo "OK: dist/rf_analyzer.fap produced."

      # --- ARTIFACT (every run) ---------------------------------------------
      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf_analyzer-fap
          path: rf_analyzer/dist/rf_analyzer.fap
          if-no-files-found: error

      # --- RELEASE (tags only) ----------------------------------------------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rf_analyzer/dist/rf_analyzer.fap
          generate_release_notes: true
          body: |
            RF Analyzer — Flipper Zero Sub-GHz research tool with optional Auto Inverse Test.

            Install: copy `rf_analyzer.fap` to `/ext/apps/Sub-GHz/` on the SD card,
            or run `ufbt launch` from the `rf_analyzer/` source directory.

            Primary mode is receive-only (scan, measure, capture, analyze).
            Auto Inverse Test (disabled by default) can transmit a bounded
            inverse waveform for authorized lab equipment testing only.
